name: openlibrary_tests
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  openlibrary_tests:
    # Pinned: Open Library requires Python 3.14.5, and actions/setup-python has
    # no 3.14.5 build for ubuntu-latest (26.04). Go back to ubuntu-latest once
    # Open Library moves to 3.14.6 or later.
    runs-on: ubuntu-24.04
    steps:
      # - if: "contains(matrix.python-version, '-dev')"
      #  run: sudo apt-get install -y libxml2 libxslt-dev
      - name: Checkout Open Library
        uses: actions/checkout@v7
        with:
          repository: internetarchive/openlibrary
      - name: Checkout current Infogami
        uses: actions/checkout@v7
        with:
          path: vendor/infogami
      - uses: actions/setup-python@v7
        with:
          # Use whatever Python Open Library's pyproject.toml requires.
          python-version-file: pyproject.toml
      - run: pip install -r requirements_test.txt
      - run: make test-py
